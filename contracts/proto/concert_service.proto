syntax = "proto3";

package digital_music_stand.concert;
option go_package = "github.com/ziomciopoziomcio/digital-music-stand/contracts/gen/concertpb";

service ConcertService {
  rpc CreateConcert(CreateConcertRequest) returns (CreateConcertResponse);
  rpc AddConcertItem(AddConcertItemRequest) returns (AddConcertItemResponse);
  rpc GetConcertSetlist(GetConcertSetlistRequest) returns (GetConcertSetlistResponse);
  rpc ListConcerts(ListConcertsRequest) returns (ListConcertsResponse);
}

message CreateConcertRequest {
  optional string id = 1;
  string name = 2;
  optional uint32 band_id = 3;
  optional string location = 4;
  optional string start_time = 5;
}

message CreateConcertResponse {
  string id = 1;
  string message = 2;
}

message AddConcertItemRequest {
  string concert_id = 1;
  optional string score_id = 2;
  optional uint32 break_min = 3;
  uint32 order = 4;
}

message AddConcertItemResponse {
  string id = 1;
  string message = 2;
}

message GetConcertSetlistRequest {
  string concert_id = 1;
}

message GetConcertSetlistResponse {
  repeated ConcertItem items = 1;
}

message ListConcertsRequest {
  optional uint32 band_id = 1;
}

message ConcertSummary {
  string id = 1;
  string name = 2;
  string checksum = 3;
  optional string location = 4;
  optional string start_time = 5;
}

message ListConcertsResponse {
  repeated ConcertSummary concerts = 1;
}

message ConcertItem {
  string id = 1;
  uint32 order = 2;
  optional string score_id = 3;
  optional string score_name = 4;
  optional string file_path = 5;
  optional uint32 break_min = 6;
}