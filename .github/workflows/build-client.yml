name: Build and Release Client

on:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Prepare monorepo for fyne-cross
        run: |
          cp -r contracts client/contracts
          
          cd client
          go mod edit -replace github.com/ziomciopoziomcio/digital-music-stand/contracts=./contracts
          go mod tidy

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      # 1. Windows (64-bit)
      - name: Build Windows amd64
        run: |
          fyne-cross windows -arch=amd64 -dir=client -name=dms-windows-amd64 -debug -app-id=com.digitalmusicstand.client -ldflags="-X main.AppVersion=${{ github.ref_name }}"

      # 2. LLinux (64-bit)
      - name: Build Linux amd64
        run: |
          fyne-cross linux -arch=amd64 -dir=client -name=dms-linux-amd64 -debug -app-id=com.digitalmusicstand.client -ldflags="-X main.AppVersion=${{ github.ref_name }}"

      # 3. Linux (ARM 64-bit)
      - name: Build Linux arm64
        run: |
          fyne-cross linux -arch=arm64 -dir=client -name=dms-linux-arm64 -debug -app-id=com.digitalmusicstand.client -ldflags="-X main.AppVersion=${{ github.ref_name }}"
          
      - name: Extract raw Linux binaries
        run: |
          cd client
          
          AMD_TAR=$(find fyne-cross -name "dms-linux-amd64.tar.xz" | head -n 1)
          ARM_TAR=$(find fyne-cross -name "dms-linux-arm64.tar.xz" | head -n 1)
          
          mkdir -p tmp_extract
          mkdir -p fyne-cross/bin/linux-amd64
          mkdir -p fyne-cross/bin/linux-arm64
          
          tar -xf "$AMD_TAR" -C tmp_extract/
          AMD_BIN=$(find tmp_extract -type f -path "*/bin/*" | head -n 1)
          mv "$AMD_BIN" fyne-cross/bin/linux-amd64/dms-linux-amd64
          
          rm -rf tmp_extract/*
          
          tar -xf "$ARM_TAR" -C tmp_extract/
          ARM_BIN=$(find tmp_extract -type f -path "*/bin/*" | head -n 1)
          mv "$ARM_BIN" fyne-cross/bin/linux-arm64/dms-linux-arm64
          
          chmod +x fyne-cross/bin/linux-amd64/dms-linux-amd64
          chmod +x fyne-cross/bin/linux-arm64/dms-linux-arm64

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/fyne-cross/bin/windows-amd64/dms-windows-amd64.exe
            client/fyne-cross/bin/linux-amd64/dms-linux-amd64
            client/fyne-cross/bin/linux-arm64/dms-linux-arm64
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}