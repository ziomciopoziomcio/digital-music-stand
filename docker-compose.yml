services:
  db:
    image: postgres:15-alpine
    container_name: digital_music_stand_db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: musicstand
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: digital_music_stand_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
